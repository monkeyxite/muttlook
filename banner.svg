<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="outlook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#005a9e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
  </g>

  <!-- Neomutt-style dog (grey, pointy ears, pink collar) -->
  <g transform="translate(100, 60)">
    <!-- Body/torso hint -->
    <ellipse cx="65" cy="155" rx="35" ry="20" fill="#555"/>
    
    <!-- Head -->
    <ellipse cx="65" cy="90" rx="45" ry="50" fill="#6b6b6b"/>
    
    <!-- Ears (pointy, dark) -->
    <path d="M 30 55 L 20 15 L 50 45 Z" fill="#4a4a4a"/>
    <path d="M 100 55 L 110 15 L 80 45 Z" fill="#4a4a4a"/>
    <!-- Inner ears -->
    <path d="M 33 50 L 27 25 L 47 45 Z" fill="#8b6b6b"/>
    <path d="M 97 50 L 103 25 L 83 45 Z" fill="#8b6b6b"/>
    
    <!-- Face (lighter muzzle) -->
    <ellipse cx="65" cy="100" rx="25" ry="22" fill="#888"/>
    
    <!-- Eyes -->
    <circle cx="48" cy="80" r="8" fill="#fff"/>
    <circle cx="82" cy="80" r="8" fill="#fff"/>
    <circle cx="50" cy="81" r="5" fill="#222"/>
    <circle cx="84" cy="81" r="5" fill="#222"/>
    <circle cx="51" cy="79" r="2" fill="#fff"/>
    <circle cx="85" cy="79" r="2" fill="#fff"/>
    
    <!-- Nose -->
    <ellipse cx="65" cy="97" rx="7" ry="5" fill="#333"/>
    <ellipse cx="65" cy="95" rx="3" ry="2" fill="#555"/>
    
    <!-- Mouth -->
    <path d="M 58 103 Q 65 110 72 103" fill="none" stroke="#444" stroke-width="1.5"/>
    
    <!-- Pink collar/bandana (like neomutt) -->
    <path d="M 35 130 Q 65 145 95 130 Q 90 140 65 142 Q 40 140 35 130 Z" fill="#d946a8"/>
    <!-- Collar highlight -->
    <path d="M 45 133 Q 65 142 85 133" fill="none" stroke="#f06bc5" stroke-width="1.5"/>
    
    <!-- Envelope in mouth -->
    <g transform="translate(42, 100)">
      <rect x="0" y="5" width="46" height="28" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
      <path d="M 0 5 L 23 22 L 46 5" fill="none" stroke="#0078d4" stroke-width="2"/>
    </g>
  </g>

  <!-- Flow arrow -->
  <g transform="translate(240, 140)">
    <path d="M 0 10 Q 40 -5 80 10 Q 120 25 160 10" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
    <polygon points="158,5 170,10 158,15" fill="#4fc3f7" opacity="0.6"/>
  </g>

  <!-- Outlook envelope icon -->
  <g transform="translate(410, 85)">
    <rect x="0" y="15" width="100" height="70" rx="8" fill="url(#outlook)"/>
    <path d="M 0 15 L 50 55 L 100 15" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.85"/>
    <!-- O mark -->
    <circle cx="50" cy="52" r="18" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.9"/>
  </g>

  <!-- Markdown badge -->
  <g transform="translate(310, 195)">
    <rect x="0" y="0" width="44" height="28" rx="4" fill="#2d2d2d" stroke="#4fc3f7" stroke-width="1.2"/>
    <text x="22" y="19" font-family="monospace" font-size="15" font-weight="bold" fill="#4fc3f7" text-anchor="middle">M↓</text>
  </g>

  <!-- Title -->
  <text x="530" y="140" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">muttlook</text>
  
  <!-- Subtitle -->
  <text x="530" y="175" font-family="'SF Pro Text', -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8899aa">Markdown → Outlook HTML from mutt</text>

  <!-- Accent line -->
  <rect x="530" y="190" width="60" height="3" rx="1.5" fill="#4fc3f7" opacity="0.8"/>
</svg>
