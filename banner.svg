<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="outlook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#005a9e"/>
    </linearGradient>
    <linearGradient id="mutt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#d4880f"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bg)" rx="12"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
  </g>

  <!-- Mutt dog silhouette (left side, stylized envelope-snout) -->
  <g transform="translate(120, 70)">
    <!-- Dog head outline -->
    <ellipse cx="60" cy="80" rx="50" ry="55" fill="url(#mutt)" opacity="0.9"/>
    <!-- Ears -->
    <path d="M 20 40 Q 10 5 30 25 Z" fill="#d4880f"/>
    <path d="M 100 40 Q 110 5 90 25 Z" fill="#d4880f"/>
    <!-- Snout as envelope shape -->
    <path d="M 30 85 L 60 65 L 90 85 L 90 110 L 30 110 Z" fill="#fff" opacity="0.95"/>
    <!-- Envelope flap (V shape) -->
    <path d="M 30 85 L 60 100 L 90 85" fill="none" stroke="#d4880f" stroke-width="2.5"/>
    <!-- Eyes -->
    <circle cx="42" cy="65" r="6" fill="#1a1a2e"/>
    <circle cx="78" cy="65" r="6" fill="#1a1a2e"/>
    <circle cx="44" cy="63" r="2" fill="#fff"/>
    <circle cx="80" cy="63" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="60" cy="82" rx="5" ry="4" fill="#1a1a2e"/>
  </g>

  <!-- Connector: arrow/flow between icons -->
  <g transform="translate(260, 130)">
    <path d="M 0 20 Q 30 0 60 20 Q 90 40 120 20" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
    <polygon points="118,15 128,20 118,25" fill="#4fc3f7" opacity="0.7"/>
  </g>

  <!-- Outlook icon (right-center) -->
  <g transform="translate(390, 75)">
    <!-- Outlook envelope body -->
    <rect x="10" y="20" width="100" height="70" rx="6" fill="url(#outlook)"/>
    <!-- Envelope flap -->
    <path d="M 10 20 L 60 60 L 110 20" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <!-- "O" letter -->
    <circle cx="60" cy="55" r="20" fill="none" stroke="#fff" stroke-width="4" opacity="0.9"/>
  </g>

  <!-- Markdown symbol overlay (center-bottom) -->
  <g transform="translate(300, 185)">
    <rect x="0" y="0" width="50" height="32" rx="4" fill="#333" stroke="#4fc3f7" stroke-width="1.5"/>
    <text x="25" y="23" font-family="monospace" font-size="18" font-weight="bold" fill="#4fc3f7" text-anchor="middle">M↓</text>
  </g>

  <!-- Title text -->
  <text x="520" y="140" font-family="'SF Pro Display', -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">muttlook</text>
  
  <!-- Subtitle -->
  <text x="520" y="175" font-family="'SF Pro Text', -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#8899aa">Markdown → Outlook HTML from mutt</text>

  <!-- Accent line -->
  <rect x="520" y="190" width="60" height="3" rx="1.5" fill="#4fc3f7" opacity="0.8"/>
</svg>
